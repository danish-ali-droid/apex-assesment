name: Continuous Deployment (CD) to AWS

on:
  workflow_run:
    workflows: ["Terraform Infrastructure Pipeline"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
concurrency:
  group: cd-deploy
  cancel-in-progress: true
jobs:
  build-and-deploy:
    name: Build, Push & Deploy Containers
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'workflow_run'
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./assesment-6/backend
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/assesment-6-backend:${{ env.SOURCE_SHA }}
            ${{ vars.DOCKERHUB_USERNAME }}/assesment-6-backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./assesment-6/frontend
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/assesment-6-frontend:${{ env.SOURCE_SHA }}
            ${{ vars.DOCKERHUB_USERNAME }}/assesment-6-frontend:latest

      # ========================================================================
      # Deploy to EC2 Web Servers via AWS Systems Manager (SSM)
      # No open SSH port required - Principle of Least Privilege!
      # ========================================================================
      - name: Deploy Containers to EC2 via AWS SSM Run Command
        env:
          AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          APP_CONFIG_SECRET_ID: ${{ secrets.APP_CONFIG_SECRET_NAME || 'cloudops-fullstack/application-config' }}
          IMAGE_TAG: ${{ env.SOURCE_SHA }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "::error::Set the DOCKERHUB_USERNAME repository variable."
            exit 1
          fi

          INSTANCE_INFO=$(aws ec2 describe-instances \
            --region "$AWS_REGION" \
            --filters "Name=tag:Role,Values=WebServer" "Name=instance-state-name,Values=pending,running,stopping,stopped,shutting-down" \
            --query 'Reservations[].Instances[].[InstanceId,State.Name]' \
            --output text)
          if [ -z "$INSTANCE_INFO" ]; then
            echo "::error::No EC2 instances tagged Role=WebServer were found in region $AWS_REGION. Check AWS_REGION and run Terraform apply first."
            exit 1
          fi

          echo "EC2 instances tagged Role=WebServer in $AWS_REGION:"
          printf '%s\n' "$INSTANCE_INFO"

          INSTANCE_IDS=$(awk '{print $1}' <<<"$INSTANCE_INFO")
          STOPPED_IDS=$(awk '$2 == "stopped" {print $1}' <<<"$INSTANCE_INFO")
          INVALID_STATES=$(awk '$2 != "running" && $2 != "stopped" && $2 != "pending" {print $1 " (" $2 ")"}' <<<"$INSTANCE_INFO")
          if [ -n "$INVALID_STATES" ]; then
            echo "::error::Cannot deploy while WebServer instances are stopping or in another transitional state: $INVALID_STATES"
            exit 1
          fi

          if [ -n "$STOPPED_IDS" ]; then
            echo "Starting stopped WebServer instances."
            aws ec2 start-instances --region "$AWS_REGION" --instance-ids $STOPPED_IDS
          fi

          echo "Waiting for WebServer instances to reach running state."
          aws ec2 wait instance-running --region "$AWS_REGION" --instance-ids $INSTANCE_IDS

          OFFLINE_IDS=""
          for attempt in $(seq 1 40); do
            OFFLINE_IDS=""
            for instance_id in $INSTANCE_IDS; do
              PING_STATUS=$(aws ssm describe-instance-information \
                --region "$AWS_REGION" \
                --filters "Key=InstanceIds,Values=$instance_id" \
                --query 'InstanceInformationList[0].PingStatus' \
                --output text)
              if [ "$PING_STATUS" != "Online" ]; then
                OFFLINE_IDS="$OFFLINE_IDS $instance_id"
              fi
            done

            if [ -z "$OFFLINE_IDS" ]; then
              break
            fi
            echo "Waiting for SSM agent on:$OFFLINE_IDS (attempt $attempt/40)."
            sleep 15
          done

          if [ -n "$OFFLINE_IDS" ]; then
            echo "::error::SSM agents are still offline for:$OFFLINE_IDS. Check the EC2 instance profile, SSM connectivity, and user data."
            exit 1
          fi

          if [ -z "$APP_CONFIG_SECRET_ID" ]; then
            echo "::error::Set the APP_CONFIG_SECRET_NAME GitHub Actions secret."
            exit 1
          fi

          COMMANDS=$(jq -cn \
            --arg region "$AWS_REGION" \
            --arg secret_id "$APP_CONFIG_SECRET_ID" \
            --arg username "$DOCKERHUB_USERNAME" \
            --arg tag "$IMAGE_TAG" \
            --arg sha "$SOURCE_SHA" \
            '{commands:[
              "set -eu",
              ("git -C /opt/app/source fetch --depth 1 origin " + $sha),
              ("git -C /opt/app/source checkout --detach " + $sha),
              ("cd /opt/app/source/assesment-6 && export AWS_REGION=" + ($region | @sh) + " APP_CONFIG_SECRET_ID=" + ($secret_id | @sh) + " DOCKERHUB_USERNAME=" + ($username | @sh) + " IMAGE_TAG=" + ($tag | @sh) + " && ./scripts/deploy-from-secrets.sh"),
              "docker image prune -f"
            ]}')

          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids $INSTANCE_IDS \
            --document-name "AWS-RunShellScript" \
            --parameters "$COMMANDS" \
            --comment "Automated GitHub Actions Deployment - Commit ${{ env.SOURCE_SHA }}" \
            --query "Command.CommandId" \
            --output text)

          DEPLOY_FAILED=false
          for instance_id in $INSTANCE_IDS; do
            echo "Waiting for deployment command on $instance_id."
            if aws ssm wait command-executed \
              --region "$AWS_REGION" \
              --command-id "$COMMAND_ID" \
              --instance-id "$instance_id"; then
              echo "Deployment command succeeded on $instance_id."
            else
              DEPLOY_FAILED=true
              echo "::error::Deployment command failed on $instance_id. SSM invocation details:"
              if ! aws ssm get-command-invocation \
                --region "$AWS_REGION" \
                --command-id "$COMMAND_ID" \
                --instance-id "$instance_id" \
                --query '{Status:Status,StatusDetails:StatusDetails,ResponseCode:ResponseCode,StandardOutputContent:StandardOutputContent,StandardErrorContent:StandardErrorContent}' \
                --output json; then
                echo "::error::Could not retrieve SSM invocation details for $instance_id."
              fi
            fi
          done

          if [ "$DEPLOY_FAILED" = true ]; then
            exit 1
          fi
