name: Terraform Infrastructure Pipeline

on:
  workflow_run:
    workflows: ["Continuous Integration & Security Scanning"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform Action to execute'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
          - destroy

permissions:
  contents: read
concurrency:
  group: terraform-infrastructure-pipeline
  cancel-in-progress: true
jobs:
  terraform:
    name: Terraform Automation
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      TF_VAR_aws_region: ${{ secrets.AWS_REGION || 'us-east-1' }}
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_environment: ${{ secrets.ENVIRONMENT }}
      TF_VAR_repository_url: ${{ secrets.REPOSITORY_URL }}
      TF_VAR_repository_ref: ${{ secrets.REPOSITORY_REF }}
      TF_VAR_dockerhub_username: ${{ vars.DOCKERHUB_USERNAME }}
      TF_VAR_app_config_secret_name: ${{ secrets.APP_CONFIG_SECRET_NAME || 'cloudops-fullstack/application-config' }}
      TF_VAR_vpc_cidr: ${{ secrets.VPC_CIDR }}
      TF_VAR_instance_type: ${{ secrets.INSTANCE_TYPE }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_node_env: ${{ secrets.NODE_ENV }}
      TF_VAR_host_port: ${{ secrets.HOST_PORT }}
      TF_VAR_db_host: ${{ secrets.DB_HOST }}
      TF_VAR_db_port: ${{ secrets.DB_PORT }}
      TF_VAR_db_user: ${{ secrets.DB_USER }}
      TF_VAR_db_name: ${{ secrets.DB_NAME }}
    defaults:
      run:
        working-directory: ./assesment-6/terraform
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.0

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Check application configuration secrets
        env:
          NODE_ENV: ${{ secrets.NODE_ENV }}
          HOST_PORT: ${{ secrets.HOST_PORT }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
        run: |
          for name in NODE_ENV HOST_PORT DB_HOST DB_PORT DB_USER DB_PASSWORD DB_NAME; do
            if [ -z "${!name}" ]; then
              echo "::error::Set the $name GitHub Actions secret."
              exit 1
            fi
          done

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Terraform Plan
        if: github.event_name == 'workflow_run' || (github.event_name == 'workflow_dispatch' && contains(fromJSON('["plan", "apply"]'), github.event.inputs.action))
        run: terraform plan -no-color -out=tfplan

      - name: Terraform Apply (Pipeline)
        if: github.event_name == 'workflow_run'
        run: terraform apply -auto-approve -no-color tfplan

      - name: Terraform Apply (Manual)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply'
        run: terraform apply -auto-approve -no-color tfplan

      - name: Terraform Destroy (Emergency / Cleanup)
        if: github.event.inputs.action == 'destroy'
        run: terraform destroy -auto-approve -no-color
