apiVersion: apps/v1
kind: Deployment
metadata:
  name: apex-operations-api
  namespace: default
  labels:
    app: apex-operations-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: apex-operations-api
  template:
    metadata:
      labels:
        app: apex-operations-api
    spec:
      containers:
      - name: api
        image: dani334/apex-api:latest  
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
          name: http
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 5000 
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 5000 
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          runAsNonRoot: true
          runAsUser: 10001
