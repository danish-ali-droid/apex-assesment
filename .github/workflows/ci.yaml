name: Continuous Integration & Security Scanning

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'assesment-6/**'
      - '.github/workflows/ci.yaml'
      - '.github/workflows/cd-deploy.yaml'
      - '.github/workflows/terraform.yaml'
  pull_request:
    branches: [main, master]
    paths:
      - 'assesment-6/**'
      - '.github/workflows/ci.yaml'
permissions:
  contents: read
  security-events: write
concurrency:
  group: ci-security-scanning
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test & Build Services
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 'assesment-6'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            assesment-6/backend/package-lock.json
            assesment-6/frontend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: assesment-6/backend
        run: npm ci

      - name: Run Backend Unit & Integration Tests
        working-directory: assesment-6/backend
        run: npm test

      - name: Install Frontend Dependencies
        working-directory: assesment-6/frontend
        run: npm ci

      - name: Build Frontend Production Bundle
        working-directory: assesment-6/frontend
        run: npm run build

  security-audit:
    name: Dependency Audit & Secret Scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 'assesment-6'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Hardcoded Secrets (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Backend Dependency Audit
        working-directory: assesment-6/backend
        run: npm audit --audit-level=high

      - name: Frontend Dependency Audit
        working-directory: assesment-6/frontend
        run: npm audit --audit-level=high

  container-vulnerability-scan:
    name: Container Vulnerability Scan (Trivy)
    runs-on: ubuntu-latest
    needs: [test-and-build]
    defaults:
      run:
        working-directory: 'assesment-6'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        run: |
          docker build -t fullstack-backend:scan ./backend

      - name: Scan Backend Image with Trivy
        uses: aquasecurity/trivy-action@f9424c10c36e288d5fa79bd3dfd1aeb2d6eae808 # v0.33.0
        with:
          image-ref: 'fullstack-backend:scan'
          version: v0.71.0
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Build Frontend Docker Image
        run: |
          docker build -t fullstack-frontend:scan ./frontend

      - name: Scan Frontend Image with Trivy
        uses: aquasecurity/trivy-action@f9424c10c36e288d5fa79bd3dfd1aeb2d6eae808 # v0.33.0
        with:
          image-ref: 'fullstack-frontend:scan'
          version: v0.71.0
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
