services:
  # Tier 1: Presentation Layer (Library Web Dashboard)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: three-tier-frontend
    ports:
      - "${HOST_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - three-tier-net
    restart: unless-stopped

  # Tier 2: Application API Layer (Library Management REST API)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: three-tier-backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=5000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-appuser}
      - DB_PASSWORD=${DB_PASSWORD:-local_dev_password}
      - DB_NAME=${DB_NAME:-librarydb}
      - DB_SSL=false
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - three-tier-net
    restart: unless-stopped

  # Tier 3: Database Persistence Layer (PostgreSQL Books Catalog)
  postgres:
    image: postgres:16-alpine
    container_name: three-tier-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${DB_USER:-appuser}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-local_dev_password}
      - POSTGRES_DB=${DB_NAME:-librarydb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d librarydb"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - three-tier-net
    restart: unless-stopped

networks:
  three-tier-net:
    driver: bridge

volumes:
  postgres_data:
