name: Continuous Deployment (CD) to AWS

on:
  push:
    branches: [main]
    paths:
      - 'assesment-6/backend/**'
      - 'assesment-6/frontend/**'
      - 'assesment-6/docker-compose*'
      - '.github/workflows/cd-deploy.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build, Push & Deploy Containers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./assesment-6/backend
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/assesment-6-backend:${{ github.sha }}
            ${{ vars.DOCKERHUB_USERNAME }}/assesment-6-backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./assesment-6/frontend
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/assesment-6-frontend:${{ github.sha }}
            ${{ vars.DOCKERHUB_USERNAME }}/assesment-6-frontend:latest

      # ========================================================================
      # Deploy to EC2 Web Servers via AWS Systems Manager (SSM)
      # No open SSH port required - Principle of Least Privilege!
      # ========================================================================
      - name: Deploy Containers to EC2 via AWS SSM Run Command
        env:
          AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "::error::Set the DOCKERHUB_USERNAME repository variable."
            exit 1
          fi

          INSTANCE_IDS=$(aws ec2 describe-instances \
            --region "$AWS_REGION" \
            --filters "Name=tag:Role,Values=WebServer" "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].InstanceId' \
            --output text)
          if [ -z "$INSTANCE_IDS" ]; then
            echo "::error::No running EC2 instances tagged Role=WebServer were found."
            exit 1
          fi

          COMMANDS=$(jq -cn \
            --arg username "$DOCKERHUB_USERNAME" \
            --arg tag "$IMAGE_TAG" \
            --arg sha "$GITHUB_SHA" \
            '{commands:[
              "set -eu",
              ("git -C /opt/app/source fetch --depth 1 origin " + $sha),
              ("git -C /opt/app/source checkout --detach " + $sha),
              ("cd /opt/app/source/assesment-6 && export DOCKERHUB_USERNAME=" + ($username | @sh) + " IMAGE_TAG=" + ($tag | @sh)),
              "docker compose -f docker-compose.prod.yml pull",
              "docker compose -f docker-compose.prod.yml up -d --no-build --remove-orphans",
              "docker image prune -f"
            ]}')

          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --targets "Key=tag:Role,Values=WebServer" \
            --document-name "AWS-RunShellScript" \
            --parameters "$COMMANDS" \
            --comment "Automated GitHub Actions Deployment - Commit ${{ github.sha }}" \
            --query "Command.CommandId" \
            --output text)

          for instance_id in $INSTANCE_IDS; do
            aws ssm wait command-executed \
              --region "$AWS_REGION" \
              --command-id "$COMMAND_ID" \
              --instance-id "$instance_id"
          done
