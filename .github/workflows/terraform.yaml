name: Terraform Infrastructure Pipeline

on:
  pull_request:
    paths:
      - 'assesment-6/terraform/**'
      - '.github/workflows/terraform.yaml'
  push:
    branches: [main]
    paths:
      - 'assesment-6/terraform/**'
      - '.github/workflows/terraform.yaml'
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform Action to execute'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
          - destroy

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform Automation
    runs-on: ubuntu-latest
    env:
      TF_VAR_aws_region: ${{ secrets.AWS_REGION || 'us-east-1' }}
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_environment: ${{ secrets.ENVIRONMENT }}
      TF_VAR_repository_url: ${{ secrets.REPOSITORY_URL }}
      TF_VAR_repository_ref: ${{ secrets.REPOSITORY_REF }}
      TF_VAR_dockerhub_username: ${{ vars.DOCKERHUB_USERNAME }}
      TF_VAR_vpc_cidr: ${{ secrets.VPC_CIDR }}
      TF_VAR_public_subnet_cidrs: ${{ secrets.PUBLIC_SUBNET_CIDRS }}
      TF_VAR_instance_type: ${{ secrets.INSTANCE_TYPE }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_db_user: ${{ secrets.DB_USER }}
      TF_VAR_db_name: ${{ secrets.DB_NAME }}
      TF_VAR_ssh_allowed_cidrs: ${{ secrets.SSH_ALLOWED_CIDRS }}
      TF_VAR_key_name: ${{ secrets.KEY_NAME }}
    defaults:
      run:
        working-directory: ./assesment-6/terraform
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.0

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Check database password secret
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          if [ -z "$DB_PASSWORD" ]; then
            echo "::error::Set the DB_PASSWORD GitHub Actions secret."
            exit 1
          fi

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Terraform Plan
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'plan')
        run: terraform plan -no-color -out=tfplan

      - name: Terraform Apply (Manual)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply'
        run: terraform apply -auto-approve -no-color

      - name: Terraform Destroy (Emergency / Cleanup)
        if: github.event.inputs.action == 'destroy'
        run: terraform destroy -auto-approve -no-color
