name: Continuous Integration & Security Scanning

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  security-events: write

jobs:
  # ==============================================================================
  # Job 1: Test & Lint Backend and Frontend
  # ==============================================================================
  test-and-build:
    name: Test & Build Services
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # Backend Tests
      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run Backend Unit & Integration Tests
        working-directory: ./backend
        run: npm test

      # Frontend Build
      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Frontend Production Bundle
        working-directory: ./frontend
        run: npm run build

  # ==============================================================================
  # Job 2: Secret Scanning & Dependency Audit
  # ==============================================================================
  security-audit:
    name: Dependency Audit & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Hardcoded Secrets (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Backend Dependency Audit
        working-directory: ./backend
        run: npm audit --audit-level=high

      - name: Frontend Dependency Audit
        working-directory: ./frontend
        run: npm audit --audit-level=high

  # ==============================================================================
  # Job 3: Docker Image Build & Trivy Vulnerability Scanning
  # ==============================================================================
  container-vulnerability-scan:
    name: Container Vulnerability Scan (Trivy)
    runs-on: ubuntu-latest
    needs: [test-and-build]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build Backend Image Locally for Scan
      - name: Build Backend Docker Image
        run: |
          docker build -t fullstack-backend:scan ./backend

      # Scan Backend with Trivy
      - name: Scan Backend Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'fullstack-backend:scan'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      # Build Frontend Image Locally for Scan
      - name: Build Frontend Docker Image
        run: |
          docker build -t fullstack-frontend:scan ./frontend

      # Scan Frontend with Trivy
      - name: Scan Frontend Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'fullstack-frontend:scan'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
