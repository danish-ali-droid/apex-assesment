services:
  postgres:
    image: postgres:16-alpine
    container_name: cloudops-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:?Set DB_USER in the environment}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the environment}
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in the environment}
      DB_PORT: ${DB_PORT:?Set DB_PORT in the environment}
    command: ["postgres", "-p", "${DB_PORT:?Set DB_PORT in the environment}"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -p \"$${DB_PORT}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  backend:
    image: ${DOCKERHUB_USERNAME:?Set DOCKERHUB_USERNAME in the environment}/assesment-6-backend:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloudops-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: ${NODE_ENV:?Set NODE_ENV in the environment}
      DB_HOST: ${DB_HOST:?Set DB_HOST in the environment}
      DB_PORT: ${DB_PORT:?Set DB_PORT in the environment}
      DB_USER: ${DB_USER:?Set DB_USER in the environment}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the environment}
      DB_NAME: ${DB_NAME:?Set DB_NAME in the environment}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - app-network

  frontend:
    image: ${DOCKERHUB_USERNAME:?Set DOCKERHUB_USERNAME in the environment}/assesment-6-frontend:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cloudops-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "${HOST_PORT:?Set HOST_PORT in the environment}:80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - app-network

volumes:
  pgdata:
    driver: local

networks:
  app-network:
    driver: bridge
